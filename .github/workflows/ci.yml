name: Host validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install host dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Host unit tests (no board, network calls or credentials)
        run: python -m unittest discover -s tests -v
      - name: Python and shell syntax
        run: |
          python -m py_compile cli/gbot
          python -m compileall -q firmware scripts tests
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Compile firmware for RP2040
        run: |
          mkdir -p artifacts/compiled
          for source in firmware/*.py; do
            name="$(basename "$source" .py)"
            mpy-cross -march=armv6m -msmall-int-bits=31 -s "$name.py" -o "artifacts/compiled/$name.mpy" "$source"
          done
      - name: Render synthetic dashboard previews
        run: python scripts/preview-dashboards.py
